<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile | LibraryPro</title>
    <link rel="stylesheet" href="/profile.css">
</head>
<body>

<div class="profile-container">

    <div class="profile-card">

        <h1>My Profile</h1>

        <p><b>Name:</b> <span th:text="${user.fullName}"></span></p>
        <p><b>Email:</b> <span th:text="${user.email}"></span></p>
        <p><b>Mobile:</b> <span th:text="${user.mobile}"></span></p>
        <p><b>Role:</b> <span th:text="${user.role}"></span></p>

        <a href="/student-dashboard">Back to Dashboard</a>
        <a href="/logout" class="logout-btn">Logout</a>

    </div>

</div>

</body>
</html>
