<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book | LibraryPro</title>
    <link rel="stylesheet" href="/book.css">
</head>
<body>

<div class="form-container">

    <div class="form-box">

        <h1>Edit Book</h1>

        <form action="/update-book" method="post">

            <input type="hidden" name="id" th:value="${book.id}">

            <input type="text" name="title" th:value="${book.title}" placeholder="Book Title" required>

            <input type="text" name="author" th:value="${book.author}" placeholder="Author Name" required>

            <input type="text" name="category" th:value="${book.category}" placeholder="Category" required>

            <input type="number" name="quantity" th:value="${book.quantity}" placeholder="Quantity" required>

            <button type="submit">Update Book</button>

        </form>

        <a href="/view-books">Back to View Books</a>

    </div>

</div>

</body>
</html>
